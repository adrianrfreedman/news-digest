name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  check:
    runs-on: macos-latest  # launchd/osascript app; macOS runners are free for public repos
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
