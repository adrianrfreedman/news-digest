[project]
name = "news-digest"
version = "0.1.0"
description = "Daily UK / World / US news digest emailed by headless Claude Code"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []  # stdlib only: launchd runs it with /usr/bin/python3

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
