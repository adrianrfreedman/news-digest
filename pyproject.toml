[project]
name = "news-digest"
version = "0.1.0"
description = "Daily news digest emailed by headless Claude Code"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "keyring>=25.7.0",
    "openai>=3.26.1",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.17.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "BLE", "UP", "SIM", "RUF"]
ignore = [
    "E501",  # ruff format wraps code; long HTML and prompt literals stay whole
    "RUF001", "RUF002", "RUF003",  # en dashes and × in prose are intentional
]
