[project]
name = "news-digest"
version = "0.1.0"
description = "Daily news digest emailed by headless Claude Code"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "openai>=3.26.1",
    "pydantic-settings>=2.15.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
